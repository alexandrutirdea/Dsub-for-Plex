-dontobfuscate
-optimizationpasses 5
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses
-dontpreverify
-verbose
-optimizations !code/simplification/arithmetic,!field/*,!class/merging/*,!code/allocation/variable

-keep public class * extends android.app.Activity
-keep public class * extends android.app.Application
-keep public class * extends android.app.Service
-keep public class * extends android.content.BroadcastReceiver
-keep public class * extends android.content.ContentProvider
-keep public class * extends android.app.backup.BackupAgentHelper
# Preferences are named in res/xml and built by PreferenceInflater through reflection,
# so nothing in the code refers to some of them by constructor. Kept since the settings
# screens moved from the framework's android.preference to AndroidX; the rule this
# replaced still named the framework package and had stopped matching anything.
-keep public class * extends androidx.preference.Preference {
    public <init>(android.content.Context);
    public <init>(android.content.Context, android.util.AttributeSet);
    public <init>(android.content.Context, android.util.AttributeSet, int);
}

# Kryo
-keep,allowshrinking class java.beans.** { *; }
-keep,allowshrinking class sun.reflect.** { *; }
-dontwarn sun.reflect.**
-dontwarn java.beans.**
-keepclassmembers public class com.esotericsoftware.** { *; }

-keepclasseswithmembernames class * {
    native <methods>;
}

-keepclassmembers class * extends android.app.Activity {
   public void *(android.view.View);
}

-keepclassmembers public class * extends android.view.View {
   void set*(***);
   *** get*();
}

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

-keep class * implements android.os.Parcelable {
  public static final android.os.Parcelable$Creator *;
}

-keep class android.support.v7.app.MediaRouteButton { *; }
-keep class android.support.v7.widget.SearchView { *; }

-dontwarn android.support.**
-dontwarn com.sothree.slidinguppanel.SlidingUpPanelLayout

# DLNA/Cling
-keep class org.fourthline.cling.** { *; }
-keep interface org.fourthline.cling.** { *; }
-dontwarn javax.**
-dontwarn org.objectweb.**
-dontwarn org.slf4j.**
-dontwarn org.mortbay.**
-dontwarn org.fourthline.**
-dontwarn org.seamless.**
-dontwarn org.eclipse.**
-dontwarn java.**
-keepattributes *Annotation*, InnerClasses, EnclosingMethod, Signature